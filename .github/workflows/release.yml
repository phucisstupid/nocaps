name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check formatting and lint
        run: bash scripts/lint.sh
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          test "$RELEASE_TAG" = "v$version"
      - name: Build and test universal app
        run: bash scripts/build.sh --universal
      - uses: actions/upload-artifact@v7
        with:
          name: NoCaps-universal
          path: |
            build/NoCaps.zip
            build/NoCaps.zip.sha256
          compression-level: 0
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: NoCaps-universal
          path: build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build
          sha256sum --check NoCaps.zip.sha256
          cat > release-notes.md <<'NOTES'
          NoCaps makes Caps Lock useful: tap for Escape, hold for Control.

          A native menu bar app for macOS 13 or later, with Launch at Login. The universal build supports Apple Silicon and Intel Macs.

          Changes in this release:

          - Fix remapping at startup and wake when the user session is inactive.
          - Add matching code-drawn app and monochrome menu bar icons.
          - Show the version next to NoCaps in the menu and hover text.
          - Add regression checks for mapping recovery and physical Control flags.

          Download NoCaps.zip, move NoCaps.app to Applications, and open it. Grant keyboard access when prompted.

          This release is ad hoc signed and not notarized. macOS may require approval in System Settings → Privacy & Security before the first launch. Keyboard permission may need to be granted again after an update.
          NOTES
          gh release create "$RELEASE_TAG" NoCaps.zip NoCaps.zip.sha256 \
            --verify-tag --title "NoCaps $RELEASE_TAG" --notes-file release-notes.md
