name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check formatting and lint
        run: bash scripts/lint.sh
      - name: Check signing safeguards
        run: bash Tests/SigningChecks.sh
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          test "$RELEASE_TAG" = "v$version"
      - name: Import release signing identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NOCAPS_SIGNING_P12: ${{ secrets.NOCAPS_SIGNING_P12 }}
          NOCAPS_SIGNING_PASSWORD: ${{ secrets.NOCAPS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$NOCAPS_SIGNING_P12" || -z "$NOCAPS_SIGNING_PASSWORD" ]]; then
            echo 'Release signing secrets are required; refusing an ad hoc release.' >&2
            exit 1
          fi
          umask 077
          nocaps_signing_dir="$(mktemp -d "$RUNNER_TEMP/nocaps-signing.XXXXXX")"
          echo "NOCAPS_SIGNING_DIR=$nocaps_signing_dir" >> "$GITHUB_ENV"
          nocaps_keychain="$nocaps_signing_dir/signing.keychain-db"
          nocaps_keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$nocaps_keychain_password"
          printf '%s' "$NOCAPS_SIGNING_P12" | base64 --decode > "$nocaps_signing_dir/identity.p12"
          security create-keychain -p "$nocaps_keychain_password" "$nocaps_keychain"
          security set-keychain-settings -lut 3600 "$nocaps_keychain"
          security unlock-keychain -p "$nocaps_keychain_password" "$nocaps_keychain"
          security import "$nocaps_signing_dir/identity.p12" -k "$nocaps_keychain" \
            -P "$NOCAPS_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$nocaps_keychain_password" "$nocaps_keychain" > /dev/null
          rm "$nocaps_signing_dir/identity.p12"
          echo "NOCAPS_SIGNING_KEYCHAIN=$nocaps_keychain" >> "$GITHUB_ENV"
      - name: Build and test universal app
        run: |
          args=(--universal)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then args+=(--release); fi
          bash scripts/build.sh "${args[@]}"
      - name: Remove release signing identity
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ -n "${NOCAPS_SIGNING_DIR:-}" ]]; then
            nocaps_cleanup_status=0
            if [[ -f "$NOCAPS_SIGNING_DIR/signing.keychain-db" ]]; then
              security delete-keychain "$NOCAPS_SIGNING_DIR/signing.keychain-db" || nocaps_cleanup_status=$?
            fi
            rm -f "$NOCAPS_SIGNING_DIR/identity.p12"
            if [[ "$nocaps_cleanup_status" == 0 ]]; then rmdir "$NOCAPS_SIGNING_DIR"; fi
            exit "$nocaps_cleanup_status"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: NoCaps-universal
          path: |
            build/NoCaps.zip
            build/NoCaps.zip.sha256
          compression-level: 0
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: NoCaps-universal
          path: build
      - uses: actions/download-artifact@v8
        with:
          name: NoCaps-Windows-x64
          path: build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build
          sha256sum --check NoCaps.zip.sha256 NoCaps-Windows-x64.zip.sha256 NoCaps.exe.sha256
          cat > release-notes.md <<'NOTES'
          - Enable remapping automatically on macOS and Windows when NoCaps opens. Pausing applies to the current run.
          - Use a persistent macOS signing identity to retain keyboard access across future updates signed with the same certificate.
          NOTES
          gh release create "$RELEASE_TAG" NoCaps.zip NoCaps.zip.sha256 \
            NoCaps-Windows-x64.zip NoCaps-Windows-x64.zip.sha256 \
            NoCaps.exe NoCaps.exe.sha256 \
            --verify-tag --title "NoCaps $RELEASE_TAG" --notes-file release-notes.md
